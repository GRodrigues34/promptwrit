name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and build executable
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyperclip pyinstaller
          pyinstaller --onefile --windowed --name promptwrit \
            --paths src \
            --add-data "src/promptwrit/assets/check.svg:promptwrit/assets" \
            src/promptwrit/__main__.py

      - name: Package Linux release archive
        run: |
          mkdir -p release_pkg
          cp dist/promptwrit install.sh uninstall.sh README.md release_pkg/
          chmod +x release_pkg/promptwrit release_pkg/install.sh release_pkg/uninstall.sh
          tar -czf promptwrit-linux-x86_64.tar.gz -C release_pkg .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: promptwrit-linux-x86_64.tar.gz
